# The site is static: nginx serves the Astro build and nothing else.
# This replaces the base image's nginx.conf. /tmp is the only writable path.

# nginx counts the node's CPUs, not the pod's share; one worker serves a static page.
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        server_tokens off;
        # Behind the Gateway the port and scheme nginx sees are not the visitor's.
        absolute_redirect off;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml application/json;

        # Every location adds its own headers to these, not in place of them.
        add_header_inherit merge;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;

        # The process is the whole service, so both probes ask only that it answers.
        location = /health/live {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Astro names every bundle by its content hash, so a file never changes.
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # A page is checked on every visit, so a deploy shows at once.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/index.html $uri.html =404;
        }
    }
}
