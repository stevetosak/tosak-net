name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @tosak/site exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/site/playwright-report/
          retention-days: 7

  # Only main ships. The deploy job comes with the project's overlay in
  # cloud-infra: deploy-scope refuses a tag bump for an overlay it does not list.
  build-push:
    if: github.ref == 'refs/heads/main'
    needs: [gate, browser]
    runs-on: ubuntu-24.04
    outputs:
      IMAGE_VERSION: ${{ steps.version.outputs.IMAGE_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "IMAGE_VERSION=alpha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/site/Dockerfile
          push: true
          tags: |
            stevetosak/tosak-net-site:latest
            stevetosak/tosak-net-site:${{ steps.version.outputs.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
